services:
  app:
    build: .
    ports: ['8000:8000']
    env_file: .env
    depends_on: {db: {condition: service_healthy}}
    volumes: [uploads_data:/app/app/static/uploads]
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-igitoro}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-CHANGE_ME}
      POSTGRES_DB: ${POSTGRES_DB:-igitorodb}
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck: {test: ['CMD-SHELL','pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}'],interval: 5s,timeout: 5s,retries: 10}
volumes: {postgres_data: {}, uploads_data: {}}
